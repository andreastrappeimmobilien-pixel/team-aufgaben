    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.r,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},k,b64(D.c)));
    localStorage.setItem("team-aufgaben-pw",pw);
    document.open();document.write(html);document.close();
  }catch(e){localStorage.removeItem("team-aufgaben-pw");if(!still)document.getElementById("f").textContent="Passwort falsch.";}
}
document.getElementById("b").onclick=()=>oeffnen(document.getElementById("p").value);
document.getElementById("p").onkeydown=e=>{if(e.key==="Enter")oeffnen(e.target.value)};
const g=localStorage.getItem("team-aufgaben-pw");if(g)oeffnen(g,true);
</script></body></html>
