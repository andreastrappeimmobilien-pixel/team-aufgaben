async function oeffnen(pw,still){
  try{
    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.r,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
